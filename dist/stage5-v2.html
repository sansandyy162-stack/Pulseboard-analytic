<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulseboard Analytics</title>
<style>
body{margin:0;background:#07111f;color:#eff7ff;font:15px system-ui}.wrap{max-width:1180px;margin:auto;padding:24px}.card{background:#10243b;border:1px solid #28506e;border-radius:14px;padding:16px}.hidden{display:none}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pages,.range{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.metric{font-size:26px;font-weight:800}.muted{color:#a8bfd3;font-size:13px}button,input{padding:10px;border-radius:8px;font:inherit}button{border:0;background:#55ded0;font-weight:750;cursor:pointer;color:#061c28}.off{background:#193651!important;color:#dbeeff!important}.chart{display:flex;align-items:end;height:180px;gap:5px;border-bottom:1px solid #315673;margin-top:12px}.bar{flex:1;min-width:7px;border-radius:5px 5px 0 0;background:linear-gradient(#55ded0,#448fff)}table{border-collapse:collapse;width:100%;margin-top:10px}th,td{border-bottom:1px solid #24445f;padding:9px;text-align:left}@media(max-width:700px){.wrap{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}}
</style>
<main class="wrap">
 <section id="login" class="card"><h2>Pulseboard Analytics</h2><p class="muted">Login dengan akun dashboard Supabase.</p><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Masuk</button><p id="message" class="muted"></p></section>
 <section id="app" class="hidden"><div class="top"><div><h1 id="title">Overview</h1><p id="status" class="muted"></p></div><button id="signout">Keluar</button></div><div id="pages" class="pages"></div><div id="cards" class="grid"></div><section class="card"><div class="top"><h3 id="chartTitle">Views harian</h3><div class="range"><button data-range="7">7 hari</button><button data-range="30" class="off">30 hari</button></div></div><div id="chart" class="chart"></div></section><section class="card"><h3>Top content</h3><div id="top"></div></section></section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://wwgkssggxytlvlejyauu.supabase.co','sb_publishable_rj83sh4YfKA1wEQUS_Tzfw_oSqJTIPp');
const $=id=>document.getElementById(id),format=x=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(x||0);
let assets=[],assetId,range=7;
async function boot(){const{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(!session)return;const{data}=await db.from('facebook_assets').select('id,name').eq('is_active',true).order('name');assets=data||[];assetId=assetId||assets[0]?.id;renderPages();if(assetId)await load();}
function renderPages(){$('pages').innerHTML=assets.map(a=>`<button class="${a.id===assetId?'':'off'}" data-asset="${a.id}">${a.name}</button>`).join('');document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{assetId=b.dataset.asset;renderPages();load()});}
async function load(){const asset=assets.find(a=>a.id===assetId);$('title').textContent=`${asset.name} — Overview`;const[{data:daily},{data:content},{data:earnings},{data:runs}]=await Promise.all([db.from('asset_daily_insights').select('*').eq('asset_id',assetId).order('metric_date',{ascending:false}).limit(30),db.from('facebook_content').select('id,caption,published_at,permalink').eq('asset_id',assetId),db.from('monetization_daily_metrics').select('*').eq('asset_id',assetId).order('metric_date',{ascending:false}).limit(1),db.from('sync_runs').select('status,started_at,finished_at,records_written,error_message').eq('asset_id',assetId).order('started_at',{ascending:false}).limit(1)]);const ids=(content||[]).map(x=>x.id);const{data:snapshots}=ids.length?await db.from('content_metric_snapshots').select('content_id,reactions,comments,shares,captured_at').in('content_id',ids).order('captured_at',{ascending:false}):{data:[]};const latest={};(snapshots||[]).forEach(x=>latest[x.content_id]??=x);const latestDaily=daily?.[0]||{},engagement=Object.values(latest).reduce((sum,x)=>sum+(x.reactions||0)+(x.comments||0)+(x.shares||0),0);const stats=[['Views',latestDaily.views],['Penonton unik',latestDaily.reach],['Engagement',latestDaily.engagements||engagement],['Followers',latestDaily.followers],['Video views',latestDaily.raw_metrics?.page_video_views],['Watch time (detik)',latestDaily.raw_metrics?.page_video_view_time],['Est. earnings USD',earnings?.[0]?.estimated_earnings]];$('cards').innerHTML=stats.map(([n,v])=>`<article class="card"><div class="muted">${n}</div><div class="metric">${format(v)}</div></article>`).join('');const points=(daily||[]).slice(0,range).reverse(),max=Math.max(1,...points.map(x=>x.views||0));$('chartTitle').textContent=`Views harian · ${range} hari terakhir`;$('chart').innerHTML=points.length?points.map(x=>`<div class="bar" title="${x.metric_date}: ${format(x.views)} views" style="height:${Math.max(3,(x.views||0)*100/max)}%"></div>`).join(''):'<span class="muted">Belum ada snapshot insight harian.</span>';const byId=Object.fromEntries((content||[]).map(x=>[x.id,x]));const top=Object.entries(latest).map(([key,v])=>({...byId[key],...v,score:(v.reactions||0)+(v.comments||0)+(v.shares||0)})).sort((a,b)=>b.score-a.score).slice(0,10);$('top').innerHTML=top.length?`<table><thead><tr><th>Konten</th><th>Reaction</th><th>Komentar</th><th>Share</th></tr></thead><tbody>${top.map(x=>`<tr><td>${(x.caption||'Tanpa caption').slice(0,75)}</td><td>${format(x.reactions)}</td><td>${format(x.comments)}</td><td>${format(x.shares)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Belum ada konten yang tersinkron.</p>';const run=runs?.[0];$('status').textContent=run?`Sync ${run.status} · ${new Date(run.finished_at||run.started_at).toLocaleString('id-ID')} · ${run.records_written||0} data ditulis`:`Belum ada riwayat sync untuk Page ini.`;}
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=Number(b.dataset.range);document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('off',Number(x.dataset.range)!==range));load()});
$('signin').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('message').textContent=error?.message||'';if(!error)boot()};$('signout').onclick=async()=>{await db.auth.signOut();boot()};boot();
</script>
</html>
