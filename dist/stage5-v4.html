<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulseboard Analytics</title><style>

import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://wwgkssggxytlvlejyauu.supabase.co','sb_publishable_rj83sh4YfKA1wEQUS_Tzfw_oSqJTIPp'),$=x=>document.getElementById(x),n=x=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(x||0),e=x=>String(x||'Tanpa caption').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let assets=[],id,days=7;async function boot(){const{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(!session)return;const{data}=await db.from('facebook_assets').select('id,name').eq('is_active',true).order('name');assets=data||[];id=id||assets[0]?.id;pages();if(id)load()}function pages(){$('pages').innerHTML=assets.map(a=>`<button class="page ${a.id===id?'active':''}" data-i="${a.id}"><i class="dot"></i>${e(a.name)}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{id=b.dataset.i;pages();load()})}async function load(){const a=assets.find(x=>x.id===id);$('title').textContent=`${a.name} — Overview`;const[{data:d},{data:c},{data:money},{data:runs}]=await Promise.all([db.from('asset_daily_insights').select('*').eq('asset_id',id).order('metric_date',{ascending:false}).limit(30),db.from('facebook_content').select('id,caption,published_at,permalink').eq('asset_id',id).order('published_at',{ascending:false}),db.from('monetization_daily_metrics').select('estimated_earnings,currency,metric_date').eq('asset_id',id).order('metric_date',{ascending:false}).limit(30),db.from('sync_runs').select('status,finished_at,started_at,records_written').eq('asset_id',id).order('started_at',{ascending:false}).limit(1)]);const ids=(c||[]).map(x=>x.id),{data:s}=ids.length?await db.from('content_metric_snapshots').select('content_id,views,reach,reactions,comments,shares,captured_at').in('content_id',ids).order('captured_at',{ascending:false}):{data:[]};const latest={};(s||[]).forEach(x=>latest[x.content_id]??=x);const last=d?.[0]||{},earn=(money||[]).reduce((z,x)=>z+Number(x.estimated_earnings||0),0),eng=Object.values(latest).reduce((z,x)=>z+(x.reactions||0)+(x.comments||0)+(x.shares||0),0);const stats=[['Views',last.views],['Penonton unik',last.reach],['Engagement',last.engagements||eng],['Followers',last.followers],['Video views',last.raw_metrics?.page_video_views],['Watch time (detik)',last.raw_metrics?.page_video_view_time],['Est. earnings USD',earn?`$${n(earn)}`:'—']];$('cards').innerHTML=stats.map(x=>`<article class="card"><div class="label">${x[0]}</div><div class="value">${typeof x[1]==='string'?x[1]:n(x[1])}</div></article>`).join('');const series=(d||[]).slice(0,days).reverse(),max=Math.max(1,...series.map(x=>x.views||0));$('chart').innerHTML=series.length?series.map(x=>{const h=Math.max(3,(x.views||0)*100/max);return`<div class="barbox" style="--h:${h}%"><span>${n(x.views)}</span><div class="bar" title="${x.metric_date}: ${n(x.views)} views"></div></div>`}).join(''):'<div class="empty">Belum ada views harian.</div>';$('dates').innerHTML=series.length?`<span>${series[0].metric_date}</span><span>${series[series.length-1].metric_date}</span>`:'';const map=Object.fromEntries((c||[]).map(x=>[x.id,x])),items=Object.entries(latest).map(([k,x])=>({...map[k],...x,score:x.views||x.reach||0})),top=[...items].sort((x,y)=>y.score-x.score).slice(0,10);$('top').innerHTML=top.length?`<table class="table"><tr><th>#</th><th>Konten</th><th>Views</th><th>Jangkauan</th><th>Interaksi</th></tr>${top.map((x,i)=>`<tr><td><span class="rank">${i+1}</span></td><td class="caption">${e(x.caption)}</td><td><b>${n(x.views)}</b></td><td>${n(x.reach)}</td><td>${n((x.reactions||0)+(x.comments||0)+(x.shares||0))}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada metrik per konten dari Meta.</div>';const newest=(c||[]).slice(0,6).map(x=>({...x,...(latest[x.id]||{})}));$('newest').innerHTML=newest.length?`<table class="table"><tr><th>Konten</th><th>
